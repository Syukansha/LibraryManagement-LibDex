# Declarative CI: every push/PR is built, tested against a real Postgres
# service container, and packaged as a Docker image.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-image:
    runs-on: ubuntu-latest

    # Backing service for the Spring context test (Liquibase runs at startup)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: library_db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d library_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    # Config is injected, never read from the repository (12-factor III)
    env:
      DB_URL: jdbc:postgresql://localhost:5432/library_db
      DB_USER: ci_user
      DB_PASSWORD: ci_password
      JWT_SECRET: ci-only-signing-secret-at-least-32-chars

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and run tests
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Build container image
        run: docker build -t libdex:${{ github.sha }} .
