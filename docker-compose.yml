# Declarative runtime topology (12-factor IV/V): the app and its backing
# Postgres declared as desired state. All varying values are substituted from
# the gitignored .env file (template: .env.example) - `docker compose up --build`.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # postgres:18+ images expect the mount at /var/lib/postgresql (data is
      # stored in a version-specific subdirectory), not the old .../data path.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d library_db"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Published to the host so a locally-run app (default DB_URL=localhost:5432)
    # and host DB clients (pgAdmin/psql/IDE) can reach it. Inside the compose
    # network the app still connects via db:5432.
    ports:
      - "5432:5432"

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/library_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
