# Declarative runtime topology (12-factor IV/V): the app and its backing
# Postgres declared as desired state. All varying values are substituted from
# the gitignored .env file (template: .env.example) - `docker compose up --build`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d library_db"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Not published to the host: reachable only from the app container.
    # Uncomment to inspect it from the host on port 5433:
    # ports:
    #   - "5433:5432"

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/library_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
