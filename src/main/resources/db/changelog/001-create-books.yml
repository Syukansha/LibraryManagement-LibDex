databaseChangeLog:
  - changeSet:
      id: 001-create-books
      author: syukri
      changes:
        - createTable:
            tableName: books
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: author
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: isbn
                  type: varchar(13)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_books_isbn
              - column:
                  name: availability
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
