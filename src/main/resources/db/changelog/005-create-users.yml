databaseChangeLog:
  - changeSet:
      id: 005-create-users
      author: syukri
      changes:
        - createTable:
            tableName: User
            columns:
              - column:
                  name: Id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: Username
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: Password
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: Email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true