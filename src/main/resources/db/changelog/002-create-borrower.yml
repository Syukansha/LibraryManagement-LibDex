databaseChangeLog:
  - changeSet:
      id: 002-create-borrower
      author: syukri
      changes:
        - createTable:
            tableName: borrower
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(254)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_borrower_email
