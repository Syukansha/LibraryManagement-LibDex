databaseChangeLog:
  - changeSet:
      id: 004-create-loans
      author: syukri
      changes:
        - createTable:
            tableName: Loans
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: BorrowerId
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: BookCopyId
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: BorrowedAt
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: ReturnedAt
                  type: timestamptz
        - addForeignKeyConstraint:
            baseTableName: Loans
            baseColumnNames: BorrowerId
            referencedTableName: Borrower
            referencedColumnNames: Id
            constraintName: fk_loans_borrower
        - addForeignKeyConstraint:
            baseTableName: Loans
            baseColumnNames: BookCopyId
            referencedTableName: BookCopy
            referencedColumnNames: id
            constraintName: fk_loans_bookcopy
