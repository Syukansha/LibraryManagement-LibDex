databaseChangeLog:
  - changeSet:
      id: 004-create-loans
      author: syukri
      changes:
        - createTable:
            tableName: loans
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: borrower_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: book_copy_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: borrowed_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: returned_at
                  type: timestamptz
        - addForeignKeyConstraint:
            baseTableName: loans
            baseColumnNames: borrower_id
            referencedTableName: borrower
            referencedColumnNames: id
            constraintName: fk_loans_borrower
        - addForeignKeyConstraint:
            baseTableName: loans
            baseColumnNames: book_copy_id
            referencedTableName: bookcopy
            referencedColumnNames: id
            constraintName: fk_loans_bookcopy
