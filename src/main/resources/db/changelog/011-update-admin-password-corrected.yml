databaseChangeLog:
  - changeSet:
      id: 011-update-admin-password-corrected
      author: syukri
      comment: "Set admin password to a verified BCrypt hash of 'password' (010 seeded a valid-format hash of the wrong plaintext)"
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: users
      changes:
        - update:
            tableName: users
            columns:
              - column:
                  name: password
                  value: "$2a$10$msxQ/5i4xkKeASuCFOiH8OhppmibOchn2EjSPF5tlixnkW6njW2Gu"
            where: username='admin'
