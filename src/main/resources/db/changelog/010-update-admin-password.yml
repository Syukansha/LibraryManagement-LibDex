databaseChangeLog:
  - changeSet:
      id: 010-update-admin-password
      author: syukri
      comment: "Fix admin password to a valid BCrypt hash of 'password' (006 seed was rejected: 'does not look like BCrypt')"
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: users
      changes:
        - update:
            tableName: users
            columns:
              - column:
                  name: password
                  value: "$2a$10$N.zmdr9k7uOCQb376NoUnuTJ8iAt6Z5EHsM8lE9lBOsl7iKTVKIUi"
            where: username='admin'
