spring.application.name=LibraryManagement

# ===== Liquibase =====
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/master.yml

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

### DB config ###
spring.datasource.url=jdbc:postgresql://localhost:5432/library_db
spring.datasource.username=library_admin
spring.datasource.password=Abcd1234
spring.datasource.driver-class-name=org.postgresql.Driver
spring.liquibase.clear-checksums=true

server.port = 8080
server.servlet.context-path=/LibDex

# Log
logging.file.name=logs/libdex.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.level.root=INFO
logging.level.com.kansha.KanshaCalBeta=DEBUG
logging.level.org.springframework.security=DEBUG
