spring.application.name=LibraryManagement

# ===== Liquibase =====
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/master.yml

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# ===== Config (12-factor III) =====
# Values that vary per deployment come from the environment. An optional,
# gitignored .env file (template: .env.example) supplies local dev values;
# real OS env vars (docker compose, CI, platform) always take precedence.
spring.config.import=optional:file:./.env[.properties]

### DB config ###
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/library_db}
spring.datasource.username=${DB_USER:library_admin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.liquibase.clear-checksums=true

# JWT signing key, injected from config so tokens survive restarts and
# multiple instances (HS256 requires a secret of at least 32 characters)
jwt.secret=${JWT_SECRET}

server.port = 8080
server.servlet.context-path=/LibDex

# Log: write to stdout only and let the platform collect/rotate the stream
# (12-factor XI) instead of managing log files inside the app
logging.level.root=INFO
logging.level.com.kansha.KanshaCalBeta=DEBUG
logging.level.org.springframework.security=DEBUG
